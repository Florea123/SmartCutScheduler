services:
  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: smartcut_ai
    env_file:
      - ./ai_service/.env
    environment:
      DOTNET_API_URL: "http://api:5000"
    ports:
      - "8000:8000"
    volumes:
      - ai_calendar_tokens:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - smartcut_network

  frontend:
    build:
      context: ./frontend/SmartCutScheduler.Web
      dockerfile: Dockerfile
    container_name: smartcut_frontend
    ports:
      - "5177:80"
    depends_on:
      - api
    networks:
      - smartcut_network
  postgres:
    image: postgres:14-alpine
    container_name: smartcut_postgres
    environment:
      POSTGRES_DB: smartcutscheduler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--auth=md5 --auth-host=md5"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartcut_network

  api:
    build:
      context: ./backend/src
      dockerfile: SmartCutScheduler.Api/Dockerfile
    container_name: smartcut_api
    init: true
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=smartcut_postgres;Port=5432;Database=smartcutscheduler;Username=postgres;Password=postgres"
      NPGSQL_ENABLE_LEGACY_TIMESTAMP_BEHAVIOR: "true"
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src/SmartCutScheduler.Api/wwwroot/profile-images:/app/wwwroot/profile-images
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smartcut_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smartcut_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smartcut.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - smartcut_network

  sonarqube:
    image: sonarqube:community
    container_name: smartcut_sonarqube
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - smartcut_network

volumes:
  postgres_data:
  ai_calendar_tokens:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  smartcut_network:
    driver: bridge
