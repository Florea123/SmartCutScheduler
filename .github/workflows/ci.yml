name: CI – Build, Test & SonarCloud

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '10.0.x'
  PYTHON_VERSION: '3.12'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. Python AI service tests ────────────────────────────────────────────
  test-python:
    name: Python Tests (AI Service)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai_service/requirements.txt

      - name: Install dependencies
        run: pip install "--only-binary=:all:" -r requirements.txt
        working-directory: ai_service

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -q
        working-directory: ai_service
        env:
          GEMINI_API_KEY: "ci-dummy-key"
          DOTNET_API_URL: "http://localhost:5000"

      - name: Upload Python coverage artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: python-coverage
          path: ai_service/coverage.xml
          retention-days: 1

  # ── 2. .NET build + test + SonarCloud ─────────────────────────────────────
  build-test-sonar:
    name: .NET Build, Test & SonarCloud
    runs-on: ubuntu-latest
    needs: test-python

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0      # SonarCloud necesită istoricul complet

      - name: Download Python coverage
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: python-coverage
          path: ai_service/

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore NuGet packages
        run: dotnet restore SmartCutScheduler.sln

      - name: SonarCloud – Begin scan
        env:
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.python.coverage.reportPaths="ai_service/coverage.xml" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.exclusions="**/Migrations/**,**/obj/**,**/bin/**,frontend/**,**/__pycache__/**,**/*.pyc,**/Seeding/**,**/Enums/DayOfWeekEnum.cs,**/Program.cs" \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs,**/DependencyInjection.cs,**/Seeding/**,ai_service/tests/**,**/FileStorage/AzureBlobStorageOptions.cs,**/FileStorage/AzureBlobStorageService.cs,**/FileStorage/LocalFileStorageService.cs"

      - name: Build .NET solution
        run: dotnet build SmartCutScheduler.sln --no-incremental -c Release

      - name: Run .NET tests with coverage
        continue-on-error: true
        run: |
          dotnet test tests/SmartCutScheduler.Tests/SmartCutScheduler.Tests.csproj \
            -c Release \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=./coverage.opencover.xml \
            --logger "trx;LogFileName=test-results.trx"
        env:
          DOTNET_ENVIRONMENT: Testing

      - name: SonarCloud – End scan & upload
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Upload .NET test results
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: dotnet-test-results
          path: "**/*.trx"
          retention-days: 7
