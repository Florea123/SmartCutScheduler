name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.REGISTRY_LOGIN_SERVER }}
  RESOURCE_GROUP: smartcut-rg
  CONTAINER_APPS_ENV: smartcut-env

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ── Login to Azure ────────────────────────────────────────────────────
      - name: Azure Login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── Login to Azure Container Registry ─────────────────────────────────
      - name: Log in to ACR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # ── Build & push API image ─────────────────────────────────────────────
      - name: Build & push API
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./backend/src
          file: ./backend/src/SmartCutScheduler.Api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/smartcut-api:${{ github.sha }},${{ env.REGISTRY }}/smartcut-api:latest

      # ── Build & push AI service image ─────────────────────────────────────
      - name: Build & push AI Service
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./ai_service
          file: ./ai_service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/smartcut-ai:${{ github.sha }},${{ env.REGISTRY }}/smartcut-ai:latest

      # ── Build & push Frontend image ────────────────────────────────────────
      - name: Build & push Frontend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./frontend/SmartCutScheduler.Web
          file: ./frontend/SmartCutScheduler.Web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/smartcut-frontend:${{ github.sha }},${{ env.REGISTRY }}/smartcut-frontend:latest

      # ── Deploy API ─────────────────────────────────────────────────────────
      - name: Deploy API to Container Apps
        env:
          DB_CONN: ${{ secrets.DB_CONNECTION_STRING }}
          JWT_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          SEED_PWD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          STRIPE_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WH: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          FRONTEND: ${{ secrets.FRONTEND_URL }}
          STORAGE_CONN: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          REG_SERVER: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          REG_USER: ${{ secrets.REGISTRY_USERNAME }}
          REG_PASS: ${{ secrets.REGISTRY_PASSWORD }}
          IMAGE: ${{ env.REGISTRY }}/smartcut-api:${{ github.sha }}
          RG: ${{ env.RESOURCE_GROUP }}
        run: |
          python3 - <<'PYEOF'
          import subprocess, os, sys
          env_vars = [
              "ASPNETCORE_ENVIRONMENT=Production",
              "ConnectionStrings__DefaultConnection=" + os.environ["DB_CONN"],
              "Jwt__SigningKey=" + os.environ["JWT_KEY"],
              "Jwt__Issuer=SmartCutScheduler",
              "Jwt__Audience=SmartCutSchedulerClient",
              "Jwt__AccessTokenMinutes=15",
              "Jwt__RefreshTokenDays=7",
              "SeedAdmin__Password=" + os.environ["SEED_PWD"],
              "SeedAdmin__Email=admin@smartcut.com",
              "SeedAdmin__Name=Admin",
              "Stripe__SecretKey=" + os.environ["STRIPE_KEY"],
              "Stripe__WebhookSecret=" + os.environ["STRIPE_WH"],
              "Stripe__SuccessUrl=" + os.environ["FRONTEND"] + "/",
              "Stripe__CancelUrl=" + os.environ["FRONTEND"] + "/",
              "AzureStorage__ConnectionString=" + os.environ["STORAGE_CONN"],
              "AzureStorage__ProfileImagesContainer=profile-images",
              "AzureStorage__FreshHaircutPhotosContainer=fresh-haircut-photos",
              "Cors__AllowedOrigins__0=" + os.environ["FRONTEND"],
              "NPGSQL_ENABLE_LEGACY_TIMESTAMP_BEHAVIOR=true",
          ]
          cmd = [
              "az", "containerapp", "update",
              "--name", "smartcut-api",
              "--resource-group", os.environ["RG"],
              "--image", os.environ["IMAGE"],
              "--registry-server", os.environ["REG_SERVER"],
              "--registry-username", os.environ["REG_USER"],
              "--registry-password", os.environ["REG_PASS"],
              "--set-env-vars", *env_vars,
          ]
          result = subprocess.run(cmd)
          sys.exit(result.returncode)
          PYEOF

      # ── Deploy AI Service ──────────────────────────────────────────────────
      - name: Deploy AI Service to Container Apps
        env:
          API_URL: ${{ secrets.API_URL }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEATHER_KEY: ${{ secrets.WEATHER_API_KEY }}
          G_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          G_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AI_SVC_URL: ${{ secrets.AI_URL }}
          FRONTEND: ${{ secrets.FRONTEND_URL }}
          REG_SERVER: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          REG_USER: ${{ secrets.REGISTRY_USERNAME }}
          REG_PASS: ${{ secrets.REGISTRY_PASSWORD }}
          IMAGE: ${{ env.REGISTRY }}/smartcut-ai:${{ github.sha }}
          RG: ${{ env.RESOURCE_GROUP }}
        run: |
          python3 - <<'PYEOF'
          import subprocess, os, sys
          env_vars = [
              "DOTNET_API_URL=" + os.environ["API_URL"],
              "GEMINI_API_KEY=" + os.environ["GEMINI_KEY"],
              "WEATHER_API_KEY=" + os.environ["WEATHER_KEY"],
              "GOOGLE_CLIENT_ID=" + os.environ["G_CLIENT_ID"],
              "GOOGLE_CLIENT_SECRET=" + os.environ["G_CLIENT_SECRET"],
              "GOOGLE_REDIRECT_URI=" + os.environ["AI_SVC_URL"] + "/calendar/callback",
              "CORS_ORIGINS=" + os.environ["FRONTEND"],
          ]
          cmd = [
              "az", "containerapp", "update",
              "--name", "smartcut-ai",
              "--resource-group", os.environ["RG"],
              "--image", os.environ["IMAGE"],
              "--registry-server", os.environ["REG_SERVER"],
              "--registry-username", os.environ["REG_USER"],
              "--registry-password", os.environ["REG_PASS"],
              "--set-env-vars", *env_vars,
          ]
          result = subprocess.run(cmd)
          sys.exit(result.returncode)
          PYEOF

      # ── Deploy Frontend ────────────────────────────────────────────────────
      - name: Deploy Frontend to Container Apps
        env:
          REG_SERVER: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          REG_USER: ${{ secrets.REGISTRY_USERNAME }}
          REG_PASS: ${{ secrets.REGISTRY_PASSWORD }}
          IMAGE: ${{ env.REGISTRY }}/smartcut-frontend:${{ github.sha }}
          RG: ${{ env.RESOURCE_GROUP }}
        run: |
          python3 - <<'PYEOF'
          import subprocess, os, sys
          cmd = [
              "az", "containerapp", "update",
              "--name", "smartcut-frontend",
              "--resource-group", os.environ["RG"],
              "--image", os.environ["IMAGE"],
              "--registry-server", os.environ["REG_SERVER"],
              "--registry-username", os.environ["REG_USER"],
              "--registry-password", os.environ["REG_PASS"],
          ]
          result = subprocess.run(cmd)
          sys.exit(result.returncode)
          PYEOF
