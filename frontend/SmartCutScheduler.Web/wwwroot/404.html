<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SmartCut Scheduler</title>
    <script type="text/javascript">
        // GitHub Pages SPA routing workaround (rafrex/spa-github-pages pattern)
        // pathSegmentsToKeep = 1 for project pages (e.g. /SmartCutScheduler/)
        var pathSegmentsToKeep = 1;
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.host +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>
<body></body>
</html>
